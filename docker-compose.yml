# Stack completo: Kafka (KRaft, sin Zookeeper) + Postgres (una DB por microservicio)
# + los 2 microservicios Quarkus + Kong como API Gateway, todos en la red "reto-net".
# Ver docs/ARQUITECTURA.md para el diagrama de contenedores y el detalle de cada
# decisión resumida aquí.
name: reto-pedidos-inventario

networks:
  reto-net:
    driver: bridge

volumes:
  pedidos_data:
  inventario_data:

services:

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    hostname: kafka
    networks:
      - reto-net
    # Solo se publica el puerto host de PLAINTEXT_HOST: es el que usaría un cliente
    # corriendo fuera de Docker (p. ej. un microservicio en `mvn quarkus:dev`).
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Dos listeners a propósito: "kafka:19092" es el que usan los microservicios
      # DENTRO de la red Docker (mcsv-pedidos, mcsv-inventario); "localhost:9092" es
      # para clientes que corren en el host (dev local, Kafka UI vía navegador, etc.).
      KAFKA_LISTENERS: PLAINTEXT://kafka:19092,CONTROLLER://kafka:19093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    # Los microservicios dependen de "kafka: condition: service_healthy" más abajo;
    # sin este healthcheck arrancarían antes de que el broker acepte conexiones.
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    networks:
      - reto-net
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka

  pedidos-db:
    image: postgres:16-alpine
    container_name: pedidos-db
    networks:
      - reto-net
    # Puerta adentro siempre es 5432 (estándar de Postgres); se publica al host en
    # 5434 para no chocar con un PostgreSQL nativo que pudiera estar usando el 5432
    # del host. mcsv-pedidos, dentro de la red Docker, sigue hablando por el 5432
    # interno (ver env QUARKUS_DATASOURCE_JDBC_URL del servicio mcsv-pedidos).
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: pedidos
      POSTGRES_USER: pedidos
      POSTGRES_PASSWORD: pedidos
    volumes:
      - pedidos_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedidos -d pedidos"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventario-db:
    image: postgres:16-alpine
    container_name: inventario-db
    networks:
      - reto-net
    # Mismo razonamiento que pedidos-db: 5432 interno, 5433 publicado al host.
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: inventario
      POSTGRES_PASSWORD: inventario
    volumes:
      - inventario_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventario -d inventario"]
      interval: 5s
      timeout: 5s
      retries: 10

  # A partir de aquí, los 2 microservicios Quarkus. Cada uno se compila con un
  # Dockerfile multi-stage (ver comentario en cada Dockerfile) — "build.context"
  # apunta a la carpeta del servicio, que ya tiene su propio Dockerfile.
  mcsv-inventario:
    build:
      context: ./mcsv-inventario
    container_name: mcsv-inventario
    networks:
      - reto-net
    ports:
      - "8081:8080"
    # Estos overrides existen SOLO para Docker. El application.properties del
    # servicio sigue apuntando a "localhost" (para que `mvn quarkus:dev` local siga
    # funcionando sin cambios); Quarkus/SmallRye Config mapea automáticamente estas
    # variables de entorno a las propiedades equivalentes (quarkus.datasource.jdbc.url,
    # kafka.bootstrap.servers), con prioridad sobre el archivo.
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://inventario-db:5432/inventario
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    # condition: service_healthy (no solo "esperar a que arranque el contenedor"):
    # Flyway corre migraciones al boot, así que necesita Postgres realmente listo
    # para aceptar conexiones, no solo el proceso del contenedor iniciado.
    depends_on:
      inventario-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  mcsv-pedidos:
    build:
      context: ./mcsv-pedidos
    container_name: mcsv-pedidos
    networks:
      - reto-net
    ports:
      - "8082:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://pedidos-db:5432/pedidos
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # mcsv-pedidos resuelve el precio de cada item contra mcsv-inventario (llamada
      # síncrona puntual al crear el pedido, ver CatalogoRestAdapter) — separado del
      # flujo Kafka asíncrono que confirma stock.
      QUARKUS_REST_CLIENT_MCSV_INVENTARIO_URL: http://mcsv-inventario:8080
    depends_on:
      pedidos-db:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Kong reemplaza al antiguo api-gateway (Quarkus a medida) como punto único de
  # entrada HTTP. Modo DB-less: la config de rutas vive versionada en
  # kong/kong.yml, no en una base de datos ni por Admin API en caliente. Kong solo
  # enruta/transforma (ver comentarios en kong.yml) — no tiene lógica de negocio.
  kong:
    image: kong:3.7
    container_name: kong
    networks:
      - reto-net
    ports:
      # 8080 es el mismo puerto host que usaba api-gateway: el frontend no necesita
      # cambiar environment.ts. 8001 es la Admin API, solo para inspección/debug
      # (curl http://localhost:8001/routes), el frontend nunca la usa.
      - "8080:8000"
      - "8001:8001"
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong/kong.yml:/kong/declarative/kong.yml:ro
    depends_on:
      - mcsv-pedidos
      - mcsv-inventario

  # Frontend Angular: build multi-stage (Node compila, Nginx sirve estáticos).
  # No recibe overrides de entorno porque apiGatewayUrl se resuelve en el BROWSER,
  # no dentro del contenedor: el navegador del usuario pide http://localhost:8080
  # directamente (el puerto publicado de Kong), nunca pasa por la red interna
  # "reto-net". Por eso environment.ts sigue apuntando a "localhost" tal cual, sin
  # necesidad de variables de entorno como en los microservicios Java.
  frontend:
    build:
      context: ./frontend/portal-pedidos-inventario
    container_name: frontend
    networks:
      - reto-net
    ports:
      - "4200:80"
    depends_on:
      - kong

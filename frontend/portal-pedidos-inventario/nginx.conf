server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Angular Router usa HTML5 pushState: cualquier ruta que no sea un archivo
    # real (p. ej. /mis-pedidos) debe resolver a index.html para que el router
    # del lado del cliente la maneje, o daría 404 al recargar la página.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
